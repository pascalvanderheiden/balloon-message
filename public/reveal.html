<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Reveal the Balloon</title>
    <style>
      :root {
        --bg-1: #fffaf3;
        --bg-2: #f3ebff;
        --ink: #201524;
        --muted: #584a61;
        --panel: rgba(255,255,255,0.82);
        --pink: #ff5aa8;
        --yellow: #ffd166;
        --mint: #7ae7c2;
        --lavender: #b8b0ff;
        --peach: #ffb899;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, 'Segoe UI', sans-serif;
        background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
        color: var(--ink);
        padding: 20px;
      }

      .wrap {
        width: min(560px, 100%);
        background: var(--panel);
        border: 1px solid rgba(86, 71, 96, 0.08);
        border-radius: 30px;
        box-shadow: 0 20px 36px rgba(72, 46, 80, 0.12);
        padding: 28px 26px 20px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--muted);
        letter-spacing: 0.08em;
        font-size: 0.76rem;
        text-transform: uppercase;
        font-weight: 800;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
      }

      .balloon-scene {
        position: relative;
        height: 360px;
        margin: 26px 0 18px;
        border-radius: 30px;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(255,255,255,0.32), rgba(183, 216, 255, 0.12));
      }

      .floating-cloud {
        position: absolute;
        background: rgba(255,255,255,0.75);
        border-radius: 999px;
      }

      .floating-cloud.c1 { top: 30px; left: 44px; width: 120px; height: 36px; }
      .floating-cloud.c2 { top: 80px; right: 60px; width: 110px; height: 34px; }
      .floating-cloud.c3 { top: 180px; left: 140px; width: 96px; height: 28px; }

      .balloon-wrap {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .balloon {
        position: relative;
        width: 180px;
        height: 210px;
        border-radius: 56% 44% 52% 48% / 55% 45% 55% 45%;
        background: linear-gradient(180deg, rgba(255,255,255,0.42), rgba(255,255,255,0.08)), var(--balloon-color, var(--pink));
        box-shadow: inset -12px -16px 16px rgba(0,0,0,0.08), 0 22px 28px rgba(80, 63, 93, 0.12);
        animation: floaty 2.8s ease-in-out infinite alternate;
      }

      .balloon::before {
        content: '';
        position: absolute;
        inset: 12px 22px auto 22px;
        height: 40%;
        border-radius: 50%;
        background: rgba(255,255,255,0.35);
      }

      .balloon::after {
        content: '';
        position: absolute;
        width: 3px;
        height: 88px;
        background: rgba(71,51,76,0.55);
        left: 50%;
        bottom: -88px;
        transform: translateX(-50%);
      }

      .balloon-tail {
        position: absolute;
        left: 50%;
        bottom: -22px;
        width: 20px;
        height: 18px;
        border-radius: 0 0 12px 12px;
        background: rgba(87,64,92,0.7);
        transform: translateX(-50%);
      }

      .balloon-message {
        position: absolute;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%);
        width: 120px;
        text-align: center;
        font-weight: 800;
        line-height: 1.2;
        color: rgba(32, 21, 36, 0.92);
        letter-spacing: 0.03em;
        word-break: break-word;
      }

      .message-box {
        background: rgba(255,255,255,0.9);
        border-radius: 18px;
        padding: 20px 18px;
        border: 1px solid rgba(88, 74, 97, 0.08);
        margin-top: 8px;
      }

      .message-box p {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.6;
      }

      .meta {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .hidden { display: none !important; }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      .cta, .secondary {
        width: 100%;
        border: none;
        border-radius: 999px;
        padding: 16px 18px;
        font-weight: 800;
        font-size: 1rem;
        cursor: pointer;
      }

      .cta {
        background: linear-gradient(135deg, #ff71b5, #ffbf5a);
        color: #201524;
        box-shadow: 0 18px 28px rgba(255, 113, 181, 0.25);
      }

      .secondary {
        background: rgba(33, 27, 43, 0.06);
        color: var(--ink);
        box-shadow: none;
      }

      .cta:disabled {
        opacity: 0.7;
        cursor: wait;
      }

      .status-box {
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 14px;
        background: rgba(255,255,255,0.62);
        border: 1px solid rgba(88, 74, 97, 0.06);
        color: var(--muted);
      }

      .status-box.error {
        background: rgba(255, 113, 181, 0.08);
        border-color: rgba(255, 113, 181, 0.2);
        color: #6f2752;
      }

      .link-row {
        margin-top: 14px;
      }

      .link-row a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 700;
      }

      @keyframes floaty {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-10px); }
      }

      @media (max-width: 540px) {
        body { padding: 12px; }
        .wrap { padding: 22px 18px 18px; }
        .actions { flex-direction: column; }
        .balloon-scene { height: 300px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Open the balloon</p>
      <h1 id="heading">A message is waiting.</h1>

      <div class="balloon-scene">
        <div class="floating-cloud c1"></div>
        <div class="floating-cloud c2"></div>
        <div class="floating-cloud c3"></div>

        <div class="balloon-wrap">
          <div id="balloon" class="balloon" style="--balloon-color: var(--pink);">
            <div class="balloon-tail"></div>
          </div>
          <div id="message-preview" class="balloon-message">Tap to reveal</div>
        </div>
      </div>

      <div class="actions">
        <button id="reveal-button" class="cta" type="button">Reveal the message</button>
        <button id="home-button" class="secondary" type="button">Create my own</button>
      </div>

      <div id="message-box" class="message-box hidden" aria-live="polite">
        <p id="message-text"></p>
      </div>

      <div id="meta" class="meta hidden"></div>
      <div id="status-box" class="status-box hidden" aria-live="polite"></div>
      <div class="link-row"><a id="home-link" href="/" class="hidden">Back to the sender page</a></div>
    </main>

    <script>
      const token = window.location.pathname.split('/').filter(Boolean).pop();
      const revealButton = document.getElementById('reveal-button');
      const homeButton = document.getElementById('home-button');
      const messageBox = document.getElementById('message-box');
      const messageText = document.getElementById('message-text');
      const meta = document.getElementById('meta');
      const balloon = document.getElementById('balloon');
      const messagePreview = document.getElementById('message-preview');
      const heading = document.getElementById('heading');
      const statusBox = document.getElementById('status-box');
      const homeLink = document.getElementById('home-link');

      function setStatus(message, isError = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle('error', isError);
        statusBox.classList.remove('hidden');
      }

      function hideStatus() {
        statusBox.textContent = '';
        statusBox.classList.add('hidden');
      }

      function setUnavailableState(message, isExpired = true) {
        heading.textContent = isExpired ? 'This balloon has drifted away' : 'This balloon is unavailable';
        revealButton.disabled = true;
        revealButton.textContent = 'Unavailable';
        homeLink.classList.remove('hidden');
        setStatus(message, true);
        messagePreview.textContent = 'No message';
      }

      async function revealMessage() {
        if (!token) {
          setUnavailableState('This link is incomplete. Try creating a fresh balloon message.', false);
          return;
        }

        revealButton.disabled = true;
        revealButton.textContent = 'Opening...';
        hideStatus();

        try {
          const response = await fetch(`/api/messages/${token}/reveal`, { method: 'POST' });
          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.error || 'The balloon could not be opened.');
          }

          balloon.style.setProperty('--balloon-color', `var(--${result.balloonColor || 'pink'})`);
          messagePreview.textContent = result.message;
          messageText.textContent = `"${result.message}"`;
          messageBox.classList.remove('hidden');
          meta.textContent = `From ${result.sender} to ${result.recipient}`;
          meta.classList.remove('hidden');
          heading.textContent = 'A balloon arrived!';
          revealButton.textContent = 'Opened';
          homeLink.classList.remove('hidden');
          setStatus('This message was revealed only once and is now closed.');
        } catch (error) {
          setUnavailableState(error.message || 'This balloon is no longer available.', true);
        }
      }

      revealButton.addEventListener('click', revealMessage);
      homeButton.addEventListener('click', () => window.location.href = '/');

      if (token) {
        fetch(`/api/messages/${token}`)
          .then(async (response) => {
            const data = await response.json();
            if (!response.ok) {
              throw new Error(data.error || 'Message not available.');
            }

            balloon.style.setProperty('--balloon-color', `var(--${data.balloonColor || 'pink'})`);
            messagePreview.textContent = 'Tap to reveal';
            heading.textContent = `A balloon for ${data.recipient}`;
            meta.textContent = `This note is waiting for ${data.recipient}.`;
            meta.classList.remove('hidden');
          })
          .catch((error) => {
            setUnavailableState(error.message || 'This balloon is unavailable. It may have expired or already been opened.', true);
          });
      } else {
        setUnavailableState('This link is incomplete. Try creating a fresh balloon message.', false);
      }
    </script>
  </body>
</html>
